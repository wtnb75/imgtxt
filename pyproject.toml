[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgtxt"
dynamic = ["version"]
description = "Turn any image into terminal text art"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Watanabe Takashi", email = "wtnb75@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Pillow>=10.0",
    "typer>=0.9",
    "wcwidth>=0.2",
]

[project.urls]
Homepage = "https://github.com/wtnb75/imgtxt"

[project.scripts]
imgtxt = "imgtxt.cli:app"

[tool.hatch.version]
path = "imgtxt/version.py"
pattern = "VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["imgtxt"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-github-actions-annotate-failures",
    "pdoc",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--cov-report=html:cover --cov-report=term --cov-branch --cov-reset --cov=imgtxt --doctest-modules"

[tool.coverage.run]
source = ["imgtxt"]

[tool.coverage.report]
fail_under = 80
show_missing = true
