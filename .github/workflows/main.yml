name: main

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/python@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
    - uses: wtnb75/actions/ruff@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
    - uses: wtnb75/actions/pytest@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
    - uses: wtnb75/actions/wheel@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
    - id: pdoc
      uses: wtnb75/actions/pdoc@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
      with:
        output-dir: docs
        module: imgtxt
        other-options: --docformat google
    - uses: wtnb75/actions/merge-pages@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
      with:
        dirs: "cover docs"
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: deploy pages
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      id: deployment
