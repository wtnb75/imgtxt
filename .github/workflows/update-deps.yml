name: update-deps

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/python@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
    - uses: wtnb75/actions/pyupdate@9c4dff839b50ce9a30c5d564206a893f8a99acee # v1.0.9
      with:
        test-args: "-xs"
